# Alembic yapılandırması (ADR-003). Komutlar backend/ klasöründen çalıştırılır:
#
#   uv run alembic upgrade head                          tüm migration'ları uygula
#   uv run alembic downgrade -1                          son migration'ı geri al
#   uv run alembic revision --autogenerate -m "açıklama"  tablo değişikliğinden yeni migration
#
# Veritabanı adresi burada YOKTUR; migrations/env.py onu DATABASE_URL'den (.env) okur.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
# Dosya adı: 20261120_1530_<kısa_kimlik>_<açıklama>.py (tarih sırası dosya listesinde görünür)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
path_separator = os

# Üretilen migration dosyası ruff ile otomatik düzeltilir ve biçimlendirilir (CI'daki kurallar).
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
