[project]
name = "kovan"
version = "0.1.0"
description = "Kovan: Notion benzeri bilgi tabanı + anlamsal arama (Sarı Takım)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "structlog>=24.1",
    "anthropic>=1.0",
    "openai>=1.50",
    "qdrant-client>=1.12",
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx2>=1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kovan"]

# --- Test ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Testlerdeki bellek içi Qdrant payload indekslerini kullanmaz; uyarı beklenen bir durum.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
markers = [
    "ac(id): testin karşıladığı kabul kriteri (docs/user-stories.md), ör. @pytest.mark.ac(\"AC-04.3\")",
    "integration: Docker gerektiren entegrasyon testi (Testcontainers)",
]

[tool.coverage.run]
source = ["kovan"]
branch = true

[tool.coverage.report]
show_missing = true
# Protocol gövdeleri (`...`) çalıştırılabilir kod değildir.
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

# --- Statik analiz ------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PT", "RET", "S", "C90"]

[tool.ruff.lint.isort]
known-first-party = ["kovan", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src,."
explicit_package_bases = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "docker.*"]
ignore_missing_imports = true

# --- Mimari denetim (docs/mimari-secimi.md § 7, ADR-001) -----------------

[tool.importlinter]
root_package = "kovan"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "API katmanı application ve domain üzerine kurulu"
type = "layers"
layers = ["kovan.api", "kovan.application", "kovan.domain"]

[[tool.importlinter.contracts]]
name = "Infrastructure application ve domain üzerine kurulu"
type = "layers"
layers = ["kovan.infrastructure", "kovan.application", "kovan.domain"]

[[tool.importlinter.contracts]]
name = "API, infrastructure'ı doğrudan kullanamaz"
type = "forbidden"
source_modules = ["kovan.api"]
forbidden_modules = ["kovan.infrastructure"]

[[tool.importlinter.contracts]]
name = "İç katmanlar framework ve dış kütüphanelerden bağımsız"
type = "forbidden"
source_modules = ["kovan.domain", "kovan.application"]
forbidden_modules = [
    "fastapi", "pydantic", "sqlalchemy", "structlog", "anthropic", "openai", "qdrant_client",
    "jwt",
]
