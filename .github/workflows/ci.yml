# Her PR'da ve main'e her push'ta çalışır (ADR-010, docs/test-strategy.md § 7).
# Kırmızı CI ile merge yapılmaz (KURALLAR.md § 2.4).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tip, mimari, test) + SonarQube
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube'un "yeni kod" analizi için tüm geçmiş gerekir

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true

      - name: Bağımlılıkları kur
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Biçim (ruff format)
        run: uv run ruff format --check .

      - name: Tip kontrolü (mypy)
        run: uv run mypy

      - name: Mimari kurallar (import-linter)
        run: uv run lint-imports

      - name: Testler + kapsam
        run: uv run pytest --cov --cov-report=xml:coverage.xml --cov-report=term

      - name: SonarQube Cloud analizi
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
