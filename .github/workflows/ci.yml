# Her PR'da ve main'e her push'ta çalışır (ADR-010, docs/test-strategy.md § 7).
# Kırmızı CI ile merge yapılmaz (KURALLAR.md § 2.4).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tip, mimari, test) + SonarQube
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Proje paketi kurulmaz (derleme betiği çalışmaz); kod doğrudan kaynaktan import edilir.
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube'un "yeni kod" analizi için tüm geçmiş gerekir

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true

      # Güvenlik: Yalnızca uv.lock'taki sabit sürümler (--locked), yalnızca hazır paketler
      # (--no-build: hiçbir paketin kurulum betiği çalıştırılmaz). Sonraki adımlar ortamı
      # yeniden çözmez veya kurmaz (--frozen --no-sync).
      - name: Bağımlılıkları kur
        run: uv sync --locked --no-build --no-install-project

      # ../eval: değerlendirme betiği backend/ dışında durur ama aynı kurallarla denetlenir
      # (mypy için pyproject.toml'daki `files` listesinde).
      - name: Lint (ruff)
        run: uv run --frozen --no-sync ruff check . ../eval

      - name: Biçim (ruff format)
        run: uv run --frozen --no-sync ruff format --check . ../eval

      - name: Tip kontrolü (mypy)
        run: uv run --frozen --no-sync mypy

      - name: Mimari kurallar (import-linter)
        run: uv run --frozen --no-sync lint-imports

      - name: Testler + kapsam
        run: uv run --frozen --no-sync pytest --cov --cov-report=xml:coverage.xml --cov-report=term

      - name: Değerlendirme betiği çalışıyor mu (fake mod)
        run: uv run --frozen --no-sync python ../eval/compare_embeddings.py --provider fake

      # Fork'tan veya Dependabot'tan açılan PR'larda GitHub secret'ları paylaşmaz; token olmadan
      # analiz yapılamaz. Bu yüzden analiz main'e push'ta ve repo içinden açılan PR'larda çalışır.
      - name: SonarQube Cloud analizi
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend:
    name: Frontend (lint, tip, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Güvenlik: Yalnızca package-lock.json'daki sabit sürümler kurulur (npm ci) ve paketlerin
      # kurulum betikleri çalıştırılmaz (--ignore-scripts).
      - name: Bağımlılıkları kur
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint ve biçim (eslint, prettier)
        run: npm run lint

      - name: Tip kontrolü (tsc)
        run: npm run typecheck

      - name: Testler (Vitest)
        run: npm test
