# SonarQube Cloud ayarları (ADR-010). Analiz CI'dan yapılır; "Automatic Analysis" kapalı olmalı.
sonar.projectKey=semihbekdas_sari-takim-kovan
sonar.organization=semihbekdas
sonar.projectName=sari-takim-kovan
sonar.sourceEncoding=UTF-8

# Analiz kapsamı. SonarQube Cloud'un yeni analiz düzeni sonar.sources ve sonar.tests'i yok sayıp
# bütün repoyu tarıyor; aynı kapsam exclusions ile verilir. Testler (backend/tests) otomatik
# olarak test dosyası sayılır.
# - backend/migrations/: Alembic'in ürettiği yapılandırma ve migration betikleri; migration'lar
#   entegrasyon testleriyle doğrulanır (tests/integration/test_migrations.py).
sonar.exclusions=backend/migrations/**

# Kapsam koşulu yalnızca backend içindir (ADR-010): Frontend kodu analiz edilir (güvenilirlik,
# güvenlik, bakım kolaylığı), ama ekran bileşenleri kapsam hesabına girmez. Frontend'de mantık
# içeren kısımlar Vitest ile test edilir ve CI'da çalışır.
sonar.coverage.exclusions=frontend/**

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
