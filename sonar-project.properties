# SonarQube Cloud ayarları (ADR-010). Analiz CI'dan yapılır; "Automatic Analysis" kapalı olmalı.
sonar.projectKey=semihbekdas_sari-takim-kovan
sonar.organization=semihbekdas
sonar.projectName=sari-takim-kovan
sonar.sourceEncoding=UTF-8

# Kaynak ve test klasörleri (frontend eklenince buraya eklenecek)
sonar.sources=backend/src
sonar.tests=backend/tests

# eval/: gerçek API ile elle çalıştırılan ölçüm betiği ve kurgusal veri. Analiz dışıdır;
# betiğin çalıştığı CI'da fake modda denenir (docs/test-strategy.md § 6).
sonar.exclusions=eval/**

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
